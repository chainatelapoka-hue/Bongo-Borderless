name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'platforms/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Bongo-Borderless-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bongo-Borderless-android
          path: platforms/android/Bongo-Borderless-android.apk
      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Bongo-Borderless-android.apk \
            --title "Bongo Borderless (latest APK)" \
            --notes "Auto-built Android APK with the Borderless theme." \
            --target "${{ github.sha }}"
